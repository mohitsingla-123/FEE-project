<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - MovieTix</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
            color: white;
            min-height: 100vh;
        }

        .header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(15, 15, 35, 0.95);
            backdrop-filter: blur(20px);
            z-index: 1000;
            padding: 1rem 0;
        }

        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        .logo {
            font-size: 2rem;
            font-weight: bold;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: #4ecdc4;
        }

        .container {
            max-width: 1400px;
            margin: 100px auto 2rem;
            padding: 0 2rem;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 2rem;
        }

        .sidebar {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 2rem;
            height: fit-content;
            position: sticky;
            top: 100px;
        }

        .profile-header {
            text-align: center;
            margin-bottom: 2rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 1rem;
        }

        .user-name {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 0.25rem;
        }

        .user-email {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
        }

        .menu-items {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .menu-item {
            padding: 1rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            border: 2px solid transparent;
        }

        .menu-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .menu-item.active {
            background: rgba(78, 205, 196, 0.2);
            border-color: #4ecdc4;
        }

        .menu-icon {
            font-size: 1.2rem;
        }

        .main-content {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 2rem;
            min-height: 600px;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .section-title {
            font-size: 2rem;
            margin-bottom: 1.5rem;
            color: #4ecdc4;
        }

        .bookings-filter {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 0.75rem 1.5rem;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid transparent;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
            font-weight: 500;
        }

        .filter-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .filter-btn.active {
            background: rgba(78, 205, 196, 0.2);
            border-color: #4ecdc4;
        }

        .bookings-list {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .booking-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 1.5rem;
            border-left: 4px solid #4ecdc4;
            transition: all 0.3s ease;
        }

        .booking-card:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateX(5px);
        }

        .booking-card.cancelled {
            border-left-color: #ff6b6b;
            opacity: 0.7;
        }

        .booking-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 1rem;
        }

        .movie-info-card {
            flex: 1;
        }

        .movie-name {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .booking-meta {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .booking-status {
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .status-confirmed {
            background: rgba(78, 205, 196, 0.2);
            color: #4ecdc4;
        }

        .status-cancelled {
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
        }

        .booking-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .detail-box {
            display: flex;
            flex-direction: column;
        }

        .detail-label {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 0.25rem;
        }

        .detail-value {
            font-weight: 600;
        }

        .booking-actions {
            display: flex;
            gap: 0.75rem;
            margin-top: 1rem;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .btn-primary {
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.3);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .btn-danger {
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
            border: 1px solid #ff6b6b;
        }

        .btn-danger:hover {
            background: rgba(255, 107, 107, 0.3);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: white;
            font-size: 1rem;
        }

        .form-group input:focus {
            outline: none;
            border-color: #4ecdc4;
            background: rgba(255, 255, 255, 0.15);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 1.5rem;
            border-radius: 15px;
            text-align: center;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: #4ecdc4;
            margin-bottom: 0.5rem;
        }

        .stat-label {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: rgba(255, 255, 255, 0.5);
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr;
            }

            .sidebar {
                position: relative;
                top: 0;
            }

            .menu-items {
                flex-direction: row;
                overflow-x: auto;
            }

            .menu-item {
                flex-shrink: 0;
            }
        }

        @media (max-width: 768px) {
            .booking-details {
                grid-template-columns: 1fr;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <nav class="nav">
            <a href="home.html" class="logo">MovieTix</a>
            <div class="nav-links">
                <a href="home.html">Home</a>
                <a href="movies.html">Movies</a>
                <a href="#" onclick="logout()">Logout</a>
            </div>
        </nav>
    </header>

    <div class="container">
        <aside class="sidebar">
            <div class="profile-header">
                <div class="avatar">JD</div>
                <div class="user-name" id="userName">Mohit Singla</div>
                <div class="user-email" id="userEmail">mohit8888singla.com</div>
            </div>

            <div class="menu-items">
                <div class="menu-item active" onclick="switchSection('bookings')">
                    <span class="menu-icon">🎟️</span>
                    <span>My Bookings</span>
                </div>
                <div class="menu-item" onclick="switchSection('profile')">
                    <span class="menu-icon">👤</span>
                    <span>Edit Profile</span>
                </div>
                <div class="menu-item" onclick="switchSection('settings')">
                    <span class="menu-icon">⚙️</span>
                    <span>Settings</span>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <!-- Bookings Section -->
            <div class="section active" id="bookings">
                <h2 class="section-title">My Bookings</h2>

                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-value" id="totalBookings">12</div>
                        <div class="stat-label">Total Bookings</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="upcomingShows">3</div>
                        <div class="stat-label">Upcoming Shows</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="totalSpent">₹8,450</div>
                        <div class="stat-label">Total Spent</div>
                    </div>
                </div>

                <div class="bookings-filter">
                    <button class="filter-btn active" onclick="filterBookings('all')">All Bookings</button>
                    <button class="filter-btn" onclick="filterBookings('upcoming')">Upcoming</button>
                    <button class="filter-btn" onclick="filterBookings('past')">Past</button>
                    <button class="filter-btn" onclick="filterBookings('cancelled')">Cancelled</button>
                </div>

                <div class="bookings-list" id="bookingsList"></div>
            </div>

            <!-- Profile Section -->
            <div class="section" id="profile">
                <h2 class="section-title">Edit Profile</h2>
                <form onsubmit="saveProfile(event)">
                    <div class="form-row">
                        <div class="form-group">
                            <label>First Name</label>
                            <input type="text" value="John" required>
                        </div>
                        <div class="form-group">
                            <label>Last Name</label>
                            <input type="text" value="Doe" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" value="john.doe@example.com" required>
                    </div>
                    <div class="form-group">
                        <label>Phone</label>
                        <input type="tel" value="+1 (555) 123-4567" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>City</label>
                            <input type="text" value="Lucknow">
                        </div>
                        <div class="form-group">
                            <label>State</label>
                            <input type="text" value="Uttar Pradesh">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </form>
            </div>

            <!-- Settings Section -->
            <div class="section" id="settings">
                <h2 class="section-title">Settings</h2>
                <div class="form-group">
                    <label>Change Password</label>
                    <input type="password" placeholder="Current Password">
                </div>
                <div class="form-group">
                    <input type="password" placeholder="New Password">
                </div>
                <div class="form-group">
                    <input type="password" placeholder="Confirm New Password">
                </div>
                <button class="btn btn-primary" onclick="changePassword()">Update Password</button>
                
                <h3 style="margin-top: 2rem; margin-bottom: 1rem;">Notifications</h3>
                <div style="display: flex; flex-direction: column; gap: 1rem;">
                    <label style="display: flex; align-items: center; gap: 1rem; cursor: pointer;">
                        <input type="checkbox" checked> Email notifications for bookings
                    </label>
                    <label style="display: flex; align-items: center; gap: 1rem; cursor: pointer;">
                        <input type="checkbox" checked> SMS notifications
                    </label>
                    <label style="display: flex; align-items: center; gap: 1rem; cursor: pointer;">
                        <input type="checkbox"> Promotional emails
                    </label>
                </div>

                <h3 style="margin-top: 2rem; margin-bottom: 1rem; color: #ff6b6b;">Danger Zone</h3>
                <button class="btn btn-danger" onclick="deleteAccount()">Delete Account</button>
            </div>
        </main>
    </div>

    <script>
        // Sample bookings data
        const bookingsData = [
            {
                id: 'BK001',
                movie: 'Cosmic Odyssey',
                theatre: 'PVR Cinemas - Phoenix Mall',
                date: '2025-11-01',
                time: '7:00 PM',
                seats: ['A1', 'A2', 'A3'],
                amount: 1050,
                status: 'confirmed',
                bookingDate: '2025-10-25'
            },
            {
                id: 'BK002',
                movie: 'Shadow Realm',
                theatre: 'INOX - Riverside Mall',
                date: '2025-11-05',
                time: '8:00 PM',
                seats: ['D5', 'D6'],
                amount: 700,
                status: 'confirmed',
                bookingDate: '2025-10-26'
            },
            {
                id: 'BK003',
                movie: 'Fast Lane',
                theatre: 'Cinepolis - One Awadh Center',
                date: '2025-10-20',
                time: '6:30 PM',
                seats: ['B7', 'B8'],
                amount: 600,
                status: 'past',
                bookingDate: '2025-10-18'
            },
            {
                id: 'BK004',
                movie: 'Love in Paris',
                theatre: 'PVR Cinemas - Sahara Ganj',
                date: '2025-10-15',
                time: '5:00 PM',
                seats: ['C3', 'C4'],
                amount: 550,
                status: 'cancelled',
                bookingDate: '2025-10-10'
            }
        ];

        // Render bookings
        function renderBookings(filter = 'all') {
            const bookingsList = document.getElementById('bookingsList');
            let filteredBookings = bookingsData;

            if (filter === 'upcoming') {
                filteredBookings = bookingsData.filter(b => b.status === 'confirmed');
            } else if (filter === 'past') {
                filteredBookings = bookingsData.filter(b => b.status === 'past');
            } else if (filter === 'cancelled') {
                filteredBookings = bookingsData.filter(b => b.status === 'cancelled');
            }

            if (filteredBookings.length === 0) {
                bookingsList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🎬</div>
                        <div>No bookings found</div>
                    </div>
                `;
                return;
            }

            bookingsList.innerHTML = filteredBookings.map(booking => `
                <div class="booking-card ${booking.status === 'cancelled' ? 'cancelled' : ''}">
                    <div class="booking-header">
                        <div class="movie-info-card">
                            <div class="movie-name">${booking.movie}</div>
                            <div class="booking-meta">
                                <div class="meta-item">🏛️ ${booking.theatre}</div>
                                <div class="meta-item">📅 ${new Date(booking.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}</div>
                                <div class="meta-item">🕐 ${booking.time}</div>
                            </div>
                        </div>
                        <div class="booking-status ${booking.status === 'confirmed' ? 'status-confirmed' : booking.status === 'cancelled' ? 'status-cancelled' : 'status-confirmed'}">
                            ${booking.status === 'confirmed' ? 'Confirmed' : booking.status === 'cancelled' ? 'Cancelled' : 'Completed'}
                        </div>
                    </div>
                    <div class="booking-details">
                        <div class="detail-box">
                            <div class="detail-label">Booking ID</div>
                            <div class="detail-value">${booking.id}</div>
                        </div>
                        <div class="detail-box">
                            <div class="detail-label">Seats</div>
                            <div class="detail-value">${booking.seats.join(', ')}</div>
                        </div>
                        <div class="detail-box">
                            <div class="detail-label">Amount Paid</div>
                            <div class="detail-value">₹${booking.amount}</div>
                        </div>
                        <div class="detail-box">
                            <div class="detail-label">Booked On</div>
                            <div class="detail-value">${new Date(booking.bookingDate).toLocaleDateString()}</div>
                        </div>
                    </div>
                    <div class="booking-actions">
                        ${booking.status === 'confirmed' ? `
                            <button class="btn btn-primary" onclick="viewTicket('${booking.id}')">View Ticket</button>
                            <button class="btn btn-secondary" onclick="downloadTicket('${booking.id}')">Download</button>
                            <button class="btn btn-danger" onclick="cancelBooking('${booking.id}')">Cancel</button>
                        ` : booking.status === 'past' ? `
                            <button class="btn btn-secondary" onclick="downloadTicket('${booking.id}')">Download Receipt</button>
                            <button class="btn btn-secondary" onclick="rateMovie('${booking.movie}')">Rate Movie</button>
                        ` : `
                            <button class="btn btn-secondary" onclick="viewRefund('${booking.id}')">View Refund Details</button>
                        `}
                    </div>
                </div>
            `).join('');
        }

        // Switch section
        function switchSection(section) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
            
            document.getElementById(section).classList.add('active');
            event.target.closest('.menu-item').classList.add('active');
        }

        // Filter bookings
        function filterBookings(filter) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderBookings(filter);
        }

        // Actions
        function viewTicket(id) {
            alert(`Viewing ticket for booking ${id}`);
            window.location.href = 'confirmation.html';
        }

        function downloadTicket(id) {
            alert(`Downloading ticket for booking ${id}`);
        }

        function cancelBooking(id) {
            if (confirm('Are you sure you want to cancel this booking? You will receive a refund according to our cancellation policy.')) {
                alert(`Booking ${id} has been cancelled. Refund will be processed in 5-7 business days.`);
                renderBookings();
            }
        }

        function rateMovie(movie) {
            alert(`Rate ${movie}: Feature coming soon!`);
        }

        function viewRefund(id) {
            alert(`Refund details for booking ${id}: ₹500 refunded to your original payment method.`);
        }

        function saveProfile(event) {
            event.preventDefault();
            alert('Profile updated successfully!');
        }

        function changePassword() {
            alert('Password changed successfully!');
        }

        function deleteAccount() {
            if (confirm('Are you sure you want to delete your account? This action cannot be undone.')) {
                alert('Account deletion request submitted. You will receive a confirmation email.');
            }
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.clear();
                window.location.href = 'signin.html';
            }
        }

        // Initialize
        renderBookings();
    </script>
</body>
</html>
